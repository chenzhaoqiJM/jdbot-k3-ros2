amcl:
  ros__parameters:
    # 运动噪声（针对速度 <2 m/s 的小型差速车）
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.05

    # TF / frames
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    tf_broadcast: true
    transform_tolerance: 0.5

    # 激光（匹配 YDLidar X3 Pro: range 0.1 - 12 m, 10 Hz）
    laser_model_type: "likelihood_field"
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_likelihood_max_dist: 2.0 # 保留，或可降到 1.5 做更严格匹配
    max_beams: 80 # 在 60~120 之间选择；80 是折中
    scan_topic: scan
    map_topic: map

    # 激光模型权重（初始值）
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2

    # 短距模型
    lambda_short: 0.1

    # 粒子滤波（对速度 <2 m/s 的室内机器人）
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # 更新频率相关（LIDAR 10 Hz）
    update_min_d: 0.05      # 15 cm 平移才触发一次更新（较灵敏）
    update_min_a: 0.05      # ≈5.7°（0.1 rad）旋转触发一次更新

    # Beam-skip（遇到玻璃或反射时有用）
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # 恢复（当定位失败时适度扩散粒子）
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.01

    # 其他
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5

    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

