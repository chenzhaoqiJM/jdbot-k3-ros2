k3_rgbd_odometry:
  ros__parameters:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info
    # Same interface layout as cuVSLAM, with a collision-free package namespace.
    odom_topic: /k3_rgbd_odometry/odom
    odom_6d_topic: /k3_rgbd_odometry/odom_6d
    tracking_topic: /k3_rgbd_odometry/tracking
    inliers_topic: /k3_rgbd_odometry/inliers
    loop_topic: /k3_rgbd_odometry/loop_closure
    optimized_path_topic: /k3_rgbd_odometry/optimized_path
    odom_frame: odom_k3_rgbd
    base_frame: base_footprint
    child_frame: base_footprint_k3_rgbd
    tf_odom_frame: odom_k3_rgbd
    tf_child_frame: base_footprint_k3_rgbd
    # Empty means the same frame as base_frame.
    full_child_frame: ""
    publish_tf: true

    # Process every 15 Hz camera pair; the higher cap avoids dropping jittered frames.
    processing_rate_hz: 20.0
    expected_frame_rate_hz: 15.0
    # D415 color/depth may be phase shifted by roughly half a 15 Hz frame.
    sync_tolerance_ms: 40.0
    tf_timeout_ms: 20.0
    pyramid_levels: 4
    cell_size: 24
    max_features: 420
    min_features: 8
    patch_radius: 3
    klt_iterations: 8
    min_depth_m: 0.25
    max_depth_m: 6.0
    min_corner_score: 600.0
    max_patch_rmse: 28.0
    ransac_threshold_m: 0.075
    ransac_iterations: 72
    reprojection_threshold_px: 3.0
    depth_scale: 0.001
    max_translation_per_frame: 0.50
    max_rotation_per_frame: 0.60

    # The full output is unmodified SE(3).  These settings only stabilize the
    # navigation-friendly planar output.  Lateral motion and non-planar body
    # motion are detected online; no chassis type is required.
    planar.translation_scale: 0.95
    planar.gap_recovery_strength: 0.25
    planar.lateral_min_gain: 0.0

    loop_closure.enabled: true
    loop_closure.keyframe_translation_m: 0.45
    loop_closure.keyframe_rotation_rad: 0.32
    loop_closure.min_keyframe_separation: 10
    loop_closure.max_features: 320
    loop_closure.descriptor_distance: 80
    loop_closure.min_matches: 16
    loop_closure.min_inliers: 12
    loop_closure.ransac_threshold_m: 0.15
